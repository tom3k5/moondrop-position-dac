name: Bug Report
description: Report a bug or hardware detection issue on Linux.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting an issue! Structured fields below help maintainers diagnose your report quickly.
  - type: dropdown
    id: area
    attributes:
      label: Component / Area
      options:
        - GUI / PySide6
        - USB HID / Hardware DSP
        - AutoEq / EQ Optimizer
        - PipeWire / UAC2 Sample Rate
        - Flatpak / udev Packaging
        - Translations (i18n)
        - Other
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Clear description of the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Connect MOONDROP Position
        2. Open Tuning, choose AutoEq catalog, and select...
        3. Click 'Apply to DAC'
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS / Distro / Desktop Environment
      placeholder: "e.g., EndeavourOS / KDE Plasma 6 (Wayland), Flatpak or source"
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostic output (--diagnose or GUI "Copy diagnostic info")
      description: Paste output from `python3 scripts/dsp_control.py --diagnose` or use Copy diagnostic info in the Guide tab.
      render: text
