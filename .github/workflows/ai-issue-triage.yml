name: AI Issue Triage

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - name: Apply area label from issue form
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body || "";
            const areaMap = {
              "GUI / PySide6": "area:gui",
              "USB HID / Hardware DSP": "area:hid",
              "AutoEq / EQ Optimizer": "area:autoeq",
              "PipeWire / UAC2 Sample Rate": "area:audio",
              "Flatpak / udev Packaging": "area:packaging",
              "Translations (i18n)": "area:i18n"
            };
            const labels = [];
            for (const [key, label] of Object.entries(areaMap)) {
              if (body.includes(key)) labels.push(label);
            }
            if (labels.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels
              });
            }

      - name: Run Gemini AI triage (when GEMINI_API_KEY secret is set)
        id: ai_triage
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request

          api_key = os.environ.get("GEMINI_API_KEY", "").strip()
          if not api_key:
              print("GEMINI_API_KEY secret is not configured; skipping AI comment.")
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
                  out.write("comment_ready=false\n")
              raise SystemExit(0)

          prompt = (
              "You are an automated triage assistant for the open-source Linux app "
              "'MOONDROP Position DAC' (PySide6, USB HID 0x4B, AutoEq, PipeWire UAC2, Flatpak).\n"
              "Provide a concise, helpful first-response comment (max 180 words) in the same language "
              "as the issue (English or Polish). Summarize the issue for maintainers, point out any "
              "missing diagnostic info (e.g. `--diagnose` or udev `/dev/hidraw*` check for HID bugs), "
              "and suggest which module (`position_gui.py`, `moondrop_position.py`, `eq_fit.py`, "
              "`autoeq_catalog.py`, `udev/`) is likely involved.\n\n"
              f"Title: {os.environ['ISSUE_TITLE']}\n\nBody:\n{os.environ['ISSUE_BODY']}"
          )
          req = urllib.request.Request(
              "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent",
              data=json.dumps({"contents": [{"parts": [{"text": prompt}]}]}).encode("utf-8"),
              headers={
                  "Content-Type": "application/json",
                  "x-goog-api-key": api_key,
              },
              method="POST",
          )
          try:
              with urllib.request.urlopen(req, timeout=30) as resp:
                  data = json.loads(resp.read().decode("utf-8"))
          except Exception as exc:
              print(f"Gemini API request failed: {type(exc).__name__}")
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
                  out.write("comment_ready=false\n")
              raise SystemExit(0)
          text = data["candidates"][0]["content"]["parts"][0]["text"].strip()
          with open("/tmp/triage_comment.md", "w", encoding="utf-8") as fh:
              fh.write("🤖 **Automated AI Triage**\n\n" + text)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write("comment_ready=true\n")
          PY

      - name: Post AI triage comment
        if: steps.ai_triage.outputs.comment_ready == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const body = fs.readFileSync("/tmp/triage_comment.md", "utf8");
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
