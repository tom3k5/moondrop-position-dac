name: Quality & Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Qt6 offscreen system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libfontconfig1 libxkbcommon0 libdbus-1-3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 ruff pytest

      - name: Run quality checks and tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python3 skrypty/check_quality.py
