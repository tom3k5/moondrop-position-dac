name: Quality & Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Qt6 offscreen system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libfontconfig1 libxkbcommon0 libdbus-1-3

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 ruff pytest

      - name: Run quality checks and tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python3 skrypty/check_quality.py
