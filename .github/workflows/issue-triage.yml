name: Issue Triage

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - name: Apply area label from issue form
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const body = context.payload.issue.body || "";
            const area = body.match(/^### Component \/ Area\s*\r?\n\s*(.+)$/m)?.[1]?.trim();
            const areaMap = {
              "GUI / PySide6": "area:gui",
              "USB HID / Hardware DSP": "area:hid",
              "AutoEq / EQ Optimizer": "area:autoeq",
              "PipeWire / UAC2 Sample Rate": "area:audio",
              "Flatpak / udev Packaging": "area:packaging",
              "Translations (i18n)": "area:i18n"
            };
            if (Object.hasOwn(areaMap, area)) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: [areaMap[area]]
              });
            }
